# Keep the IntelliJ Platform Gradle Plugin default test-IDE excludes and also exclude Vue.
# IDEA 2026.1.3 can initialize the bundled Vue LSP service during Java PSI fixture VFS refresh,
# even though Spring Config Guard does not depend on Vue. Excluding it keeps Java PSI tests isolated.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=\
  com.intellij.openRewrite,\
  com.intellij.ja,\
  com.intellij.ko,\
  com.intellij.zh,\
  org.jetbrains.plugins.vue

# Kotlin is used only by the IDE integration tests; the shipped plugin remains Java.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
