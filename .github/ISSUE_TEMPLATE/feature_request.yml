name: Feature request
description: Suggest a Spring Config Guard improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case without including credentials, production configuration values, customer data, signing material, or Marketplace account data.
        Security reports belong in the private disclosure flow described by the repository SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What Spring configuration workflow or risk should the plugin address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired deterministic behavior. Use synthetic examples if configuration is needed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include secrets, production configuration values, customer data, signing material, or Marketplace account data.
          required: true
