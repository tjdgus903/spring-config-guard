name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Unit tests
        run: gradle test

      - name: Verify plugin project configuration
        run: gradle verifyPluginProjectConfiguration

      - name: Verify plugin structure
        run: gradle verifyPluginStructure

      - name: Build plugin
        run: gradle buildPlugin
