name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Wrapper version
        run: ./gradlew --version

      - name: Unit tests
        run: ./gradlew test

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Compile smoke-test sample
        run: ./gradlew -p samples/config-mapping classes

      - name: Package smoke-test sample
        run: ./gradlew buildSmokeTestSample

      - name: Verify distributable archives
        run: python3 scripts/verify_smoke_test_archives.py

      - name: Set up IDE virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb openbox

      - name: IDE UI smoke test
        timeout-minutes: 20
        run: |
          mkdir -p build/ui-smoke
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' \
            sh -c 'openbox --sm-disable >build/ui-smoke/openbox.log 2>&1 & exec ./gradlew integrationTest --max-workers=2'

      - name: Upload IDE UI test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-config-guard-ui-tests-${{ github.sha }}
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/
            build/ui-smoke/
            out/ide-tests/tests/**/log*/
            out/ide-tests/tests/**/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-config-guard-plugin-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke-test sample ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-config-guard-sample-${{ github.sha }}
          path: build/smoke-test/spring-config-guard-sample.zip
          if-no-files-found: error
          retention-days: 14
