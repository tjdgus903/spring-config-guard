name: Signed release artifact

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      RELEASE_GIT_REF: ${{ inputs.git_ref }}
    steps:
      - name: Materialize and validate signing secrets
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          test -n "$CERTIFICATE_CHAIN" || { echo 'Missing CERTIFICATE_CHAIN secret'; exit 1; }
          test -n "$PRIVATE_KEY" || { echo 'Missing PRIVATE_KEY secret'; exit 1; }
          test -n "$PRIVATE_KEY_PASSWORD" || { echo 'Missing PRIVATE_KEY_PASSWORD secret'; exit 1; }
          [[ "$RELEASE_GIT_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'git_ref must be a full commit SHA'; exit 1; }
          signing_directory="$RUNNER_TEMP/spring-config-guard-signing"
          certificate_chain_file="$signing_directory/chain.crt"
          private_key_file="$signing_directory/private.pem"
          umask 077
          mkdir -p "$signing_directory"
          printf '%s\n' "$CERTIFICATE_CHAIN" > "$certificate_chain_file"
          printf '%s\n' "$PRIVATE_KEY" > "$private_key_file"
          openssl x509 -in "$certificate_chain_file" -noout -checkend 0
          openssl pkey -in "$private_key_file" -passin env:PRIVATE_KEY_PASSWORD -check -noout
          echo "SIGNING_DIRECTORY=$signing_directory" >> "$GITHUB_ENV"
          echo "CERTIFICATE_CHAIN_FILE=$certificate_chain_file" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY_FILE=$private_key_file" >> "$GITHUB_ENV"

      - name: Checkout exact release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.git_ref }}
          persist-credentials: false

      - name: Record resolved commit
        id: source
        shell: bash
        run: |
          resolved="$(git rev-parse --verify HEAD)"
          test "$resolved" = "$RELEASE_GIT_REF" || { echo 'Checked out commit does not match git_ref'; exit 1; }
          echo "sha=$resolved" >> "$GITHUB_OUTPUT"
          echo "Building commit $resolved"

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Verify release candidate
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin verifyPlugin buildSmokeTestSample

      - name: Verify distributable archives
        run: python3 scripts/verify_smoke_test_archives.py

      - name: Sign and verify plugin archive
        run: ./gradlew signPlugin verifyPluginSignature

      - name: Require exactly one signed archive
        shell: bash
        run: |
          mapfile -t signed < <(find build/distributions -maxdepth 1 -type f -name '*-signed.zip' -print)
          test "${#signed[@]}" -eq 1 || { echo "Expected one signed ZIP, found ${#signed[@]}"; exit 1; }
          unzip -t "${signed[0]}"

      - name: Upload signed plugin ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spring-config-guard-signed-${{ steps.source.outputs.sha }}
          path: build/distributions/*-signed.zip
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "$SIGNING_DIRECTORY" == "$RUNNER_TEMP/spring-config-guard-signing" ]]; then
            rm -f "$CERTIFICATE_CHAIN_FILE" "$PRIVATE_KEY_FILE"
            rmdir "$SIGNING_DIRECTORY" 2>/dev/null || true
          else
            echo 'Refusing to clean an unexpected signing directory'
            exit 1
          fi
